<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <form action="" method="post" onsubmit="return valid2()">
        <fieldset>
        <legend>evaluation d'un bijou</legend>

                <td>identifiant du bijou : </td>
                <td><input type="text" name="idt" id="idt"></td>
            </tr>
            <tr>
                <td>expert : </td>
                <td>
                    <select name="" id="exp">
                        <option value="">choisir un expert</option>
                        <option value="A22">chokri sfaxi</option>
                        <option value="A23">mohamed jerbi</option>
                        <option value="A24">radhia gafsi</option>
                    </select>
                </td>
            </tr>
        </table>
        <fieldset>
            <legend>critéres déévaluation</legend>

                <tr>
                    <td>finition : </td>
                    <td><input type="text" name="fin" id="fin"></td>
                </tr>
                <tr>
                    <td>originalité : </td>
                    <td><input type="radio" name="btn" id="btn1">
                        <input type="radio" name="btn" id="btn2">

                </tr>
                <tr>
                    <td>commentaire : </td>
                    <td><input type="text" name="com" id="com"></td>
                </tr>
            </table>
        </fieldset>
        <input type="submit" value="enregitrer" >
        <input type="reset" value="annuler">
    </fieldset>
    </form>

</html>
